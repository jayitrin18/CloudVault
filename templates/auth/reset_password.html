<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Reset Password - CloudVault
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            ☁️ CloudVault
        </div>

        <div class="auth-badge">
            PASSWORD RESET
        </div>

        <h1>
            Create New Password
        </h1>

        <p class="auth-subtitle">
            Enter your new CloudVault password.
        </p>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                <div class="flash-message">

                    {% for message in messages %}

                        {{ message }}

                    {% endfor %}

                </div>

            {% endif %}

        {% endwith %}


        <form method="POST">


            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter new password"
                    minlength="8"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    minlength="8"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Reset Password
            </button>

        </form>


        <a
            href="{{ url_for('auth.login') }}"
            class="back-home"
        >
            ← Back to Login
        </a>

    </div>

</div>

</body>

</html>
