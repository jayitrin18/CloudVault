<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Register - CloudVault
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            ☁️ CloudVault
        </div>

        <div class="auth-badge">
            CSE CLOUD STORAGE PROJECT
        </div>

        <h1>
            Create Account
        </h1>

        <p class="auth-subtitle">
            Create your CloudVault account.
        </p>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                <div class="flash-message">

                    {% for message in messages %}

                        {{ message }}

                    {% endfor %}

                </div>

            {% endif %}

        {% endwith %}


        <form method="POST">


            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Create Account
            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="{{ url_for('auth.login') }}">
                Login
            </a>

        </p>


        <a href="/" class="back-home">
            ← Back to CloudVault
        </a>

    </div>

</div>

</body>

</html>
